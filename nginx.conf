server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 🔥 GZIP compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
    }
}